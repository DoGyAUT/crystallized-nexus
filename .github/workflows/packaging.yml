name: Release Packaging

on:
  push:
    tags:
      - 'playtest-*'
      - 'release-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-22.04
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # $'...' rather than "..." - in a plain double-quoted string the \n stayed a
          # literal backslash-n, which the launcher then showed verbatim in its
          # "What's new" panel. --generate-notes appends the commits since the previous
          # release, which is what testers actually want to read there.
          gh release create "$RELEASE_TAG" \
            --title "Crystallized Nexus $RELEASE_TAG" \
            --notes $'Platform packages are attached below.\n\nThe launcher downloads and updates these for you.' \
            --generate-notes \
            --prerelease || echo "Release already exists"

  linux:
    name: Linux AppImage
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Remove System .NET
        run: sudo apt-get remove -y dotnet* || true

      - name: Install .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Environment
        run: echo "GIT_TAG=${RELEASE_TAG}" >> ${GITHUB_ENV}

      - name: Package AppImage
        working-directory: .modsdk
        run: |
          make engine
          mkdir -p build/linux
          sudo apt-get install -y desktop-file-utils
          ./packaging/linux/buildpackage.sh "${GIT_TAG}" "${PWD}/build/linux"

      - name: Upload Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" .modsdk/build/linux/*

  windows:
    name: Windows Installer
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Environment
        run: |
          echo "GIT_TAG=${RELEASE_TAG}" >> ${GITHUB_ENV}
          sudo apt-get update
          sudo apt-get install -y nsis wine64

      - name: Package Installer
        working-directory: .modsdk
        run: |
          make engine
          mkdir -p build/windows
          ./packaging/windows/buildpackage.sh "${GIT_TAG}" "${PWD}/build/windows"

      - name: Upload Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" .modsdk/build/windows/*

  macos:
    name: macOS Disk Image
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Environment
        run: echo "GIT_TAG=${RELEASE_TAG}" >> ${GITHUB_ENV}

      # Unsigned build: MACOS_DEVELOPER_IDENTITY/CERTIFICATE/NOTARIZATION secrets are not
      # configured, so buildpackage.sh skips codesigning and notarization. Testers will see
      # a Gatekeeper "unidentified developer" warning on first launch.
      - name: Package Disk Image
        working-directory: .modsdk
        run: |
          make engine
          mkdir -p build/macos
          ./packaging/macos/buildpackage.sh "${GIT_TAG}" "${PWD}/build/macos"

      - name: Upload Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" .modsdk/build/macos/*
