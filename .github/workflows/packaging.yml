name: Release Packaging

on:
  push:
    tags:
      - 'playtest-*'
      - 'release-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-22.04
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "Crystallized Nexus $RELEASE_TAG" \
            --notes "## Crystallized Nexus $RELEASE_TAG\n\nSee attached files for platform packages." \
            --prerelease || echo "Release already exists"

  linux:
    name: Linux AppImage
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Remove System .NET
        run: sudo apt-get remove -y dotnet* || true

      - name: Install .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Environment
        run: echo "GIT_TAG=${RELEASE_TAG}" >> ${GITHUB_ENV}

      - name: Package AppImage
        working-directory: .modsdk
        run: |
          make engine
          mkdir -p build/linux
          sudo apt-get install -y desktop-file-utils
          ./packaging/linux/buildpackage.sh "${GIT_TAG}" "${PWD}/build/linux"

      - name: Upload Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" .modsdk/build/linux/*

  windows:
    name: Windows Installer
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Environment
        run: |
          echo "GIT_TAG=${RELEASE_TAG}" >> ${GITHUB_ENV}
          sudo apt-get update
          sudo apt-get install -y nsis wine64

      - name: Package Installer
        working-directory: .modsdk
        run: |
          make engine
          mkdir -p build/windows
          ./packaging/windows/buildpackage.sh "${GIT_TAG}" "${PWD}/build/windows"

      - name: Upload Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" .modsdk/build/windows/*
