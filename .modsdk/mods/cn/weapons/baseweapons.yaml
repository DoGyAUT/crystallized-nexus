	Inherits@FLASH: ^FlashSmallY
	Projectile: Bullet
		Image: shell_large
		Blockable: false
		ContrailLength: 20
		ContrailStartWidth: 0c64
		ContrailEndWidth: 0c16

^DefaultMissile:
	Inherits@DefaultWahead: ^MissileWarhead
	Inherits@FLASH: ^FlashSmallY
	ReloadDelay: 60
	Range: 6c0
	MinRange: 0c512
	ValidTargets: Ground, Air, DeadInfantry
	Projectile: Missile
		MinimumLaunchAngle: 200
		MaximumLaunchAngle: 200
		MaximumLaunchSpeed: 50
		MinimumLaunchSpeed: 50
		Speed: 0c256
