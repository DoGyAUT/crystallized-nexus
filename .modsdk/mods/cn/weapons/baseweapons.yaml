^MG:
	Inherits@DefaultWahead: ^BulletWarhead
	ReloadDelay: 20
	Range: 4c0
	Projectile: InstantHit
	Warhead@1Dam: SpreadDamage
		Damage: 15
	Warhead@2Eff: CreateEffect
		Explosions: piffs
		ValidTargets: Ground, Air, DeadInfantry
		InvalidTargets: Vehicle, Cyborg
