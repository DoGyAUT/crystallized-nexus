^HealWeapon:
	ReloadDelay: 80
	Range: 2c849
	Report: healer1.aud
	ValidTargets: Heal
	TargetActorCenter: true
	Projectile: InstantHit
	Warhead@1Eff: FlashTargetsInRadius
		ValidTargets: Heal
		ValidRelationships: Ally
	Warhead@2Dam: TargetDamage
		DebugOverlayColor: 00FF00
		Damage: -50
		ValidTargets: Heal
		ValidRelationships: Ally

Heal:
	Inherits: ^HealWeapon

Repair:
	Inherits: ^HealWeapon
	Inherits@FLASH: ^FlashSmallW
	Range: 1c819
	Report: repair11.aud
	ValidTargets: Repair
	Warhead@1Eff: FlashTargetsInRadius
		ValidTargets: Repair
	Warhead@2Dam: TargetDamage
		ValidTargets: Repair
	Warhead@3Eff: CreateEffect
		Explosions: sparks1, sparks2, sparks3, sparks4, sparks5
		ExplosionPalette: effect
