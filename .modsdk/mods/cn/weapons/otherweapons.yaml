FireballLauncher:
	Inherits@DefaultWahead: ^FireWarhead
	Inherits@FLASH: ^FlashSmallY
	ValidTargets: Ground, Trees
	ReloadDelay: 50
	Range: 6c256
	Report: flamtnk1.aud
	Projectile: Bullet
		Speed: 128
		Image: flametrailer
		Inaccuracy: 1c512
		TrailImage: flametrailer
		TrailPalette: effect
		TrailInterval: 2
	Burst: 5
	BurstDelays: 5
	Warhead@1Dam: SpreadDamage
		Spread: 288
		Falloff: 100, 50, 25, 12, 6, 3, 0
		ValidTargets: Ground, Trees
		Damage: 25
	Warhead@2Smu: LeaveSmudge
		SmudgeType: SmallScorch
		InvalidTargets: Vehicle, Building, Wall

Bomb:
	Inherits@DefaultWahead: ^ExplosionWarhead
	ReloadDelay: 60
	Burst: 5
	BurstDelays: 6
	Range: 2c512
	TargetActorCenter: true
	ValidTargets: Ground, Trees
	Projectile: GravityBomb
		Velocity: 72, 0, -90
		Acceleration: 0, 0, -8
		Image: shell_large
		Shadow: true
		Palette: player
	Warhead@1Dam: SpreadDamage
		Spread: 512
		Falloff: 100, 50, 25, 12, 6, 3, 0
		Damage: 300
		ValidTargets: Ground, Trees
	Warhead@2Eff: CreateEffect
		Explosions: artexplo01, artexplo02, artexplo03, artexplo04
		ExplosionPalette: effect
		ImpactSounds: Tank_hit_HE_v1.ogg, Tank_hit_HE_v2.ogg, Tank_hit_HE_v3.ogg
		ValidTargets: Ground, Trees, Air
	Warhead@3EffWater: CreateEffect
		Explosions: small_watersplash
		ExplosionPalette: player
		ImpactSounds: ssplash3.aud
		ValidTargets: Water
		InvalidTargets: Vehicle
	Warhead@4Smu: LeaveSmudge
		SmudgeType: MediumCrater
		InvalidTargets: Vehicle, Building, Wall
	Warhead@5Res: DestroyResource
		Size: 1

