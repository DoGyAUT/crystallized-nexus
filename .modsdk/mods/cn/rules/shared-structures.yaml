GASILO:
	Inherits: ^Building
	Inherits@SHAPE: ^2x2Shape
	Buildable:
		Queue: Building
		BuildPaletteOrder: 60
		Prerequisites: proc, ~techlevel.low
		Description: actor-gasilo.description
	Valued:
		Cost: 150
	Tooltip:
		Name: actor-gasilo.name
	Building:
		Footprint: xx xx
		Dimensions: 2, 2
	-GivesBuildableArea:
	CNHealth:
		HP: 300
	Armor:
		Type: Light
	RevealsShroud:
		Range: 4c0
		MaxHeightDelta: 3
	RenderSprites:
		Image: gasilo.gdi
		FactionImages:
			gdi: gasilo.gdi
			nod: gasilo.nod
		FullBrightPaletteIndexRanges: 168, 175
	WithResourceLevelOverlay@FILLSTAGE:
		RequiresCondition: !build-incomplete
		Sequence: stages
	WithSpriteBody:
		Sequence: idle-underlay
	WithIdleOverlay@LIGHTS-BRIGHT:
		RequiresCondition: !build-incomplete
		Sequence: idle-lights-bright
		Palette: bright
	StoresPlayerResources:
		Capacity: 1500
	Power:
		Amount: -10
	GrantConditionOnPlayerResources:
		Condition: contains-tiberium
	FireWarheadsOnDeath:
		RequiresCondition: contains-tiberium
		Weapon: TiberiumExplosion
	SpawnActorOnDeath@TIBCLOUD1:
		Actor: TIBCLOUD1
		OwnerType: InternalName
		InternalOwner: Neutral
		Probability: 85
		RequiresCondition: contains-tiberium
	SpawnActorOnDeath@TIBCLOUD2:
		Actor: TIBCLOUD2
		OwnerType: InternalName
		InternalOwner: Neutral
		Probability: 55
		RequiresCondition: contains-tiberium
	SpawnActorOnDeath@TIBCLOUD3:
		Actor: TIBCLOUD1
		OwnerType: InternalName
		InternalOwner: Neutral
		Probability: 55
		RequiresCondition: contains-tiberium
	SpawnActorOnDeath@TIBCLOUD4:
		Actor: TIBCLOUD2
		OwnerType: InternalName
		InternalOwner: Neutral
		Probability: 85
		RequiresCondition: contains-tiberium
	WithResourceStoragePipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		Margin: 8, 2
		FullSequence: pip-green-building
		EmptySequence: pip-empty-building
		PipStride: 4, 2
		PipCount: 12
		Palette: pips
	BotCapabilities:
		Capabilities: Economy

