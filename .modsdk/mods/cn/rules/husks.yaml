^VehicleHusk:
	Inherits@CRUSHABLETYPE: ^CrushableVehicleHusk
	Immobile:
	HuskFacing:
	BodyOrientation:
		QuantizedFacings: 0
		UseClassicPerspectiveFudge: False
		CameraPitch: 85
	RenderVoxels:
		Palette: cdvoxels.charred
		NormalsPalette: RA2normals
		LightAmbientColor: -0.1,-0.1,-0.1
		LightDiffuseColor: 0.8,0.8,0.8
		LightPitch: 128
		LightYaw: 896
		Scale: 10
	CNWithVoxelBody:
	RenderSprites:
	Targetable:
		TargetTypes: Ground
	Armor:
		Type: None
	GrantRandomCondition:
		Conditions: husk-fire-1, husk-fire-2, husk-fire-3
	DamageSmoke:
		MinimumDamageState: Undamaged
		CriticalDamageState: Critical
		Interval: 6
		CriticalInterval: 3
		Image: durasmoke_medium
		Sequences: idle
		Palette: effect
		Offsets: 0,-1536,120
		Lifetime: 200, 300
		Rise: 16, 32
		Drift: 0, 8
		RandomRate: 18
		TurnRate: 1
	PeriodicSpriteEffect@FIREFLICKER:
		Image: explosion
		Sequences: tiny_flash_y
		Palette: effect
		MinInterval: 5
		MaxInterval: 5
		Offset: 0,0,192
	WithIdleOverlay@FIRE1:
		Image: huskfire01a
		Sequence: idle-overlay
		RequiresCondition: husk-fire-1
		Palette: effect
		Offset: 0,0,128
	WithIdleOverlay@FIRE2:
		Image: huskfire02a
		Sequence: idle-overlay
		RequiresCondition: husk-fire-2
		Palette: effect
		Offset: 0,0,128
	WithIdleOverlay@FIRE3:
		Image: huskfire03a
		Sequence: idle-overlay
		RequiresCondition: husk-fire-3
		Palette: effect
		Offset: 0,0,128
	HitShape:
	CNHealth:
		HP: 100
	ChangesHealth:
		Step: -10
		StartIfBelow: 101
		Delay: 500
	FireWarheadsOnDeath:
		Weapon: HuskExplode
	HiddenUnderFog:
		Type: GroundPosition
	Interactable:
	ScriptTriggers:

