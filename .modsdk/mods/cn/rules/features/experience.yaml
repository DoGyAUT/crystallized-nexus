^GainsExperience:
	GainsExperience:
		LevelUpNotification: LevelUp
		LevelUpTextNotification: notification-unit-promoted
		Conditions:
			500: rank
			1000: rank
		LevelUpImage: crate-effects
	GrantCondition@RANK-VETERAN:
		RequiresCondition: rank == 1
		Condition: rank-veteran
	GrantCondition@RANK-ELITE:
		RequiresCondition: rank >= 2
		Condition: rank-elite
	FirepowerMultiplier@VETERAN:
		RequiresCondition: rank-veteran
		Modifier: 110
	FirepowerMultiplier@ELITE:
		RequiresCondition: rank-elite
		Modifier: 130
	DamageMultiplier@VETERAN:
		RequiresCondition: rank-veteran
		Modifier: 90
	DamageMultiplier@ELITE:
		RequiresCondition: rank-elite
		Modifier: 75
	SpeedMultiplier@VETERAN:
		RequiresCondition: rank-veteran
		Modifier: 120
	SpeedMultiplier@ELITE:
		RequiresCondition: rank-elite
		Modifier: 140
	ReloadDelayMultiplier@VETERAN:
		RequiresCondition: rank-veteran
		Modifier: 90
	ReloadDelayMultiplier@ELITE:
		RequiresCondition: rank-elite
		Modifier: 75
	ChangesHealth@ELITE:
		Step: 2
		Delay: 100
		StartIfBelow: 100
		DamageCooldown: 125
		RequiresCondition: rank-elite
	WithDecoration@VETERAN:
		RequiresCondition: rank-veteran
		Position: BottomRight
		Margin: 3, 4
		Image: rank
		Sequence: veteran
		Palette: ra
		ValidRelationships: Ally, Enemy, Neutral
	WithDecoration@ELITE:
		RequiresCondition: rank-elite
		Position: BottomRight
		Margin: 3, 4
		Image: rank
		Sequence: elite
		Palette: ra
		ValidRelationships: Ally, Enemy, Neutral

^InfantryExperienceHospitalOverrides:
	WithDecoration@VETERAN:
		BlinkInterval: 32
		BlinkPatterns:
			hospitalheal: On, Off
	WithDecoration@ELITE:
		BlinkInterval: 32
		BlinkPatterns:
			hospitalheal: On, Off