^GainsExperience:
	GainsExperience:
		LevelUpNotification: LevelUp
		LevelUpTextNotification: notification-unit-promoted
		Conditions:
			500: rank
			1000: rank
			1600: rank
			2400: rank
			3400: rank
		LevelUpImage: crate-effects
	GrantCondition@RANK1:
		RequiresCondition: rank == 1
		Condition: rank-1
	GrantCondition@RANK2:
		RequiresCondition: rank == 2
		Condition: rank-2
	GrantCondition@RANK3:
		RequiresCondition: rank == 3
		Condition: rank-3
	GrantCondition@RANK4:
		RequiresCondition: rank == 4
		Condition: rank-4
	GrantCondition@RANK5:
		RequiresCondition: rank >= 5
		Condition: rank-5
	GrantCondition@RANK-VETERAN:
		RequiresCondition: rank >= 1
		Condition: rank-veteran
	GrantCondition@RANK-ELITE:
		RequiresCondition: rank >= 4
		Condition: rank-elite
	FirepowerMultiplier@RANK1:
