^ExistsInWorld:
	AppearsOnRadar:
	UpdatesPlayerStatistics:
	CombatDebugOverlay:
	GivesExperience:
		PlayerExperienceModifier: 1
	ScriptTriggers:
	RenderDebugState:

^SpriteActor:
	BodyOrientation:
		UseClassicPerspectiveFudge: False
		CameraPitch: 85
	QuantizeFacingsFromSequence:
	RenderSprites:

^VoxelActor:
	BodyOrientation:
		QuantizedFacings: 0
		UseClassicPerspectiveFudge: False
	RenderVoxels:
	CNWithVoxelBody:
		RequiresCondition: !inside-tunnel

^VoxelVehicle:
	Inherits: ^Vehicle
	BodyOrientation:
		QuantizedFacings: 0
		UseClassicPerspectiveFudge: False
	RenderVoxels:
		PlayerPalette: cdvoxels
		NormalsPalette: RA2normals
		LightAmbientColor: -0.1,-0.1,-0.1
		LightDiffuseColor: 0.8,0.8,0.8
		LightPitch: 128
		LightYaw: 768
		Scale: 10
	CNWithVoxelBody:
		RequiresCondition: !inside-tunnel

^VoxelTank:
	Inherits: ^Tank
	BodyOrientation:
		QuantizedFacings: 0
		UseClassicPerspectiveFudge: False
	RenderVoxels:
		PlayerPalette: cdvoxels
		NormalsPalette: RA2normals
		LightAmbientColor: -0.1,-0.1,-0.1
		LightDiffuseColor: 0.8,0.8,0.8
		LightPitch: 128
		LightYaw: 768
		Scale: 10
	CNWithVoxelBody:
		RequiresCondition: !inside-tunnel

^VoxelWalker:
	Inherits: ^VoxelTank

^CivilianVoxelVehicle:
	Inherits: ^Vehicle
	Inherits: ^VoxelActor
	Inherits@CRUSHABLETYPE: ^CrushableLightVehicle
	-MustBeDestroyed:

^CivilianVoxelCrusher:
	Inherits: ^CivilianVoxelVehicle
	Mobile:
		Locomotor: heavywheeled

^TerrainOverlay:
	Immobile:
		OccupiesSpace: False
	RenderSprites:
		Palette: terraindecoration
	WithSpriteBody:
	BodyOrientation:
		UseClassicPerspectiveFudge: False
		QuantizedFacings: 1
