^BlossomTree:
	Inherits@1: ^SpriteActor
	Interactable:
	Tooltip:
		Name: meta-blossomtree-name
	RenderSprites:
		Palette: player
	WithSpriteBody:
	Building:
		Footprint: x
		Dimensions: 1,1
	AppearsOnRadar:
	RadarColorFromTerrain:
		Terrain: Tiberium
	AppearsOnMapPreview:
		Terrain: Tiberium
	FrozenUnderFog:
	SeedsResource:
		ResourceType: Tiberium
		Interval: 55
	WithIdleAnimation:
		Interval: 500, 1000
	MapEditorData:
		Categories: Resource spawn
	AmbientSound:
		SoundFiles: gasflow1.ogg, gasflow2.ogg
		Delay: 150, 450
		Interval: 750, 1600

^Tree:
	Inherits@1: ^SpriteActor
	Inherits@2: ^ExistsInWorld
	Inherits@ARMORTYPE: ^FeatureArmortypeFlora
	Building:
		Footprint: f
		Dimensions: 1, 1
	RandomTransformsNearResources@TIBGREEN:
		Type: Tiberium
		IntoActors: FONA06, FONA07, FONA08, FONA09, FONA10, FONA11, FONA12, FONA13, FONA14, FONA15 #, TIBTRE01, TIBTRE02, TIBTRE03
		Adjacency: 1
		Density: 2
		Delay: 2000, 5000
	RandomTransformsNearResources@TIBBLUE:
		Type: BlueTiberium
		IntoActors: FONA01, FONA02, FONA03, FONA04, FONA05 #, BIGBLUE
		Adjacency: 1
		Density: 2
		Delay: 2000, 5000
	Interactable:
	FrozenUnderFog:
	AppearsOnRadar:
	RadarColorFromTerrain:
		Terrain: Tree
	AppearsOnMapPreview:
		Terrain: Tree
	RenderSprites:
		Palette: terraindecoration
	WithSpriteBody:
	Tooltip:
		Name: meta-tree-name
	MapEditorData:
		Categories: Tree
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral
	HitShape:
	CNHealth:
		HP: 20
	Armor:
		Type: Light
	Targetable:
		TargetTypes: Ground, Trees, NoAutoTarget
	ProximityExternalCondition@FORESTCOVER:
		Condition: forest-cover
		Range: 1c512
		ValidRelationships: Ally, Neutral, Enemy
	GrantConditionOnDamageState@Small:
		Condition: small-fire
		ValidDamageStates: Medium
	GrantConditionOnDamageState@Large:
		Condition: large-fire
		ValidDamageStates: Heavy, Critical
	WithIdleOverlay@SmallFire:
		Image: fire2
		Palette: effect
		RequiresCondition: small-fire
	WithIdleOverlay@LargeFire:
		Image: fire1
		Palette: effect
		RequiresCondition: large-fire
	SpreadsCondition@Fire:
		RequiresCondition: small-fire || large-fire
		SpreadCondition: burning
	ChangesHealth:
		StartIfBelow: 101
		Step: -5
		RequiresCondition: small-fire || large-fire || burning

