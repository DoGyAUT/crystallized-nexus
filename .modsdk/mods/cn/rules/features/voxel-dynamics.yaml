^VoxelDynamicsBike:
	VoxelDynamics:
		MaxPitch: 120
		MaxRoll: 80
		SpringStrength: 15
		Damping: 80
		ImpactPitch: 40
		ImpactRoll: 30
		ImpactHoldTicks: 3
		ImpactDamageTypes: SmallExplosionDeath, ExplosionDeath
