^Decoration:
	Inherits@1: ^SpriteActor
	Interactable:
	HiddenUnderShroud:
	RenderSprites:
		Palette: terraindecoration
	WithSpriteBody:
	Building:
		Footprint: x
		Dimensions: 1, 1
	MapEditorData:
		Categories: Decoration
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral

^Box:
	Inherits: ^Decoration
	Tooltip:
		Name: meta-box-name

^Drum:
	Inherits: ^Decoration
	Tooltip:
		Name: meta-drum-name

^Palette:
	Inherits: ^Decoration
	Tooltip:
		Name: meta-palette-name

^Selectable:
	Selectable:
	SelectionDecorations:
	WithTextControlGroupDecoration:
		Margin: 2, 0
	DrawLineToTarget:
		QueuedLineWidth: 2
		QueuedMarkerWidth: 3

^SelectableCombatUnit:
	Inherits@selectiondecorations: ^Selectable
	Selectable:
		Priority: 10
		PriorityModifiers: Ctrl

^SelectableSupportUnit:
	Inherits@selectiondecorations: ^Selectable
	Selectable:
		Priority: 8
		PriorityModifiers: Ctrl, Alt

^SelectableEconomicUnit:
	Inherits@selectiondecorations: ^Selectable
	Selectable:
		Priority: 6
		PriorityModifiers: Ctrl, Alt

^SelectableBuilding:
	IsometricSelectable:
		Priority: 2
	IsometricSelectionDecorations:
	WithTextControlGroupDecoration:
		Margin: 1, 1
	DrawLineToTarget:
		QueuedLineWidth: 2
		QueuedMarkerWidth: 3

^SelectableCombatBuilding:
	Inherits@selectiondecorations: ^SelectableBuilding
	IsometricSelectable:
		Priority: 4

^PrimaryBuilding:
	PrimaryBuilding:
		PrimaryCondition: primary
		SelectionNotification: PrimaryBuildingSelected
		SelectionTextNotification: notification-primary-building-selected
	WithTextDecoration@primary:
		RequiresCondition: primary
		Position: Top
		RequiresSelection: true
		Text: PRIMARY
		Color: E0D048

^CargoPips:
	WithCargoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		Palette: pips
		Margin: 5, 2
		CustomPipSequences:
			red: pip-red
			green: pip-green
			yellow: pip-yellow