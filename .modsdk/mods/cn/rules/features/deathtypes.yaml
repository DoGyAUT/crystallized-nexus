^RegularInfantryDeath:
	Inherits@CRUSHABLETYPE: ^CrushableInfantry
	WithDeathAnimation@normal:
		DeathSequence: die-
		DeathTypes:
			BulletDeath: twirling
	WithDeathAnimation@explosion:
		DeathSequence: die-
		DeathSequencePalette: apolra
		DeathPaletteIsPlayerPalette: False
		DeathTypes:
			ExplosionDeath: exploding
			SmallExplosionDeath: exploding
	WithDeathAnimation@energy:
		DeathSequence: die-
		DeathSequencePalette: ra
		DeathPaletteIsPlayerPalette: False
		DeathTypes:
			EnergyDeath: melting
	WithDeathAnimation:
		CrushedSequence: die-crushed
		CrushedSequencePalette: player
		CrushedPaletteIsPlayerPalette: true
	DeathSounds@NORMAL:
		DeathTypes: BulletDeath, SmallExplosionDeath
	DeathSounds@EXPLOSION:
		Voice: Explode
		DeathTypes: ExplosionDeath
	DeathSounds@BURNED:
		Voice: Burned
		DeathTypes: FireDeath
	DeathSounds@ZAPPED:
		Voice: Zapped
		DeathTypes: EnergyDeath
	FireProjectilesOnDeath@BLOOD:
		Weapons: Blood
		Pieces: 1,5
		Range: 1c0, 3c0
#	SpawnActorOnDeath@BLOODDECAL:
#		Actor: BLOODDECAL
#		OwnerType: InternalName
#		InternalOwner: Neutral
#		Probability: 65
	SpawnActorOnDeath@HUSK:
		Actor: INFANTRY.Husk
		OwnerType: InternalName
		InternalOwner: Neutral
		DeathTypes: BulletDeath, SmallExplosionDeath, ExplosionDeath
	SpawnActorOnDeath:
		Actor: visc_sml
		Probability: 10
		OwnerType: InternalName
		InternalOwner: Creeps
		DeathType: TriggerVisceroid
		RequiresLobbyCreeps: true
	SpawnActorOnDeath@FLAMEGUY:
		Actor: FLAMEGUY
		DeathType: FireDeath
