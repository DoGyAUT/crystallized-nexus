GASOL.Member:
	Inherits: ^Soldier
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@SQUAD: ^MobSquadMember
	-SelectionDecorations:
	Voiced:
		VoiceSet: Marine
	CNHealth:
		HP: 125
	Armor:
		Type: Light
	Mobile:
		Speed: 71
	Armament@PRIMARY:
		Weapon: GMinigun
		RequiresCondition: !rank-elite
	Armament@ELITE:
		Weapon: M1Carbine
		RequiresCondition: rank-elite
	AttackFrontal:
		FacingTolerance: 0
	WithSplitAttackPaletteInfantryBody:
		DefaultAttackSequence: attack
	RevealsShroud:
		Range: 5c0
	BotCapabilities:
		Capabilities: Infantry, AntiInfantry
