GASPOTTER.Member:
	Inherits: ^Soldier
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@EXPHOSPITAL: ^InfantryExperienceHospitalOverrides
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@SQUAD: ^MobSquadMember
	-SelectionDecorations:
	Voiced:
		VoiceSet: Spotter
	Valued:
		Cost: 500
	RenderSprites:
		Image: GASPOTTER
	CNHealth:
		HP: 100
	Armor:
		Type: Light
	Mobile:
		Speed: 71
	RevealsShroud:
		Range: 10c0
	Armament@PRIMARY:
		Weapon: Marksmanrifle
	AttackFrontal:
		FacingTolerance: 0
	WithSplitAttackPaletteInfantryBody:
		DefaultAttackSequence: attack
	RevealsShroud:
		Range: 10c0
	DetectCloaked:
		Range: 8c0
		DetectionTypes: cloak, forest-cover
	RenderDetectionCircle:
	Cloak@SELF:
		InitialDelay: 90
		CloakDelay: 90
		CloakSound: stealth01.aud
		UncloakSound: unstealth01.aud
		UncloakOn: Attack, Unload, Infiltrate, Demolish, Damage, Heal, SupportPower
		PauseOnCondition: cloak-force-disabled || empdisable
		CloakType: nod-stealth
	GrantConditionOnDamageState@UNCLOAK:
		Condition: cloak-force-disabled
		ValidDamageStates: Critical
	BotCapabilities:
		Capabilities: Infantry, AntiInfantry, Cloaked

