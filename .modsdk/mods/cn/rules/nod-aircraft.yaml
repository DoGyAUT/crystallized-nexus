SCRIN:
	Inherits: ^EMPableAircraft
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@VOXELDYNAMICS: ^VoxelDynamicsAircraft
	Valued:
		Cost: 1500
	Tooltip:
		Name: actor-scrin.name
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		Queue: Air
		BuildPaletteOrder: 40
		Prerequisites: ~nahpad, napyra, ~techlevel.high
		Description: actor-scrin.description
	Selectable:
		Bounds: 905, 1448
	Voiced:
		VoiceSet: Scrin
	Aircraft:
		CruiseAltitude: 8c0
		TurnSpeed: 15
		Speed: 200
		IdleTurnSpeed: 6
		IdleSpeed: 100
		TakeoffSounds: dropup1.aud
		LandingSounds: dropdwn1.aud
		CanHover: false
		CanSlide: false
		Pitch: 0
		PitchSpeed: 2
		Roll: 120
		RollSpeed: 20
		IdealSeparation: 1c512
	CNHealth:
		HP: 200
	Armor:
		Type: Light
	SecondaryHealth@ARMOR:
		MaxHP: 200
		InitialHP: -1
		ArmorType: Medium
		RegenerateRate: 0
		RegenerateDelay: 100
		RegenerateInterval: 5
		BypassDamageTypes: BypassArmor, BypassArmorLight
		PierceDamageTypes: PierceArmor
		PiercePercentage: 40
		RepairDamageTypes: RepairArmor
		FullCondition: armor-up
		EmptyCondition: armor-broken
		DepletedSound:
		RechargedSound:
		BarColor: D4AA00
	Armament:
		Weapon: Proton
		PauseOnCondition: !ammo
	AttackAircraft:
		Voice: Attack
		FacingTolerance: 80
		PersistentTargeting: false
		PauseOnCondition: empdisable
	AmmoPool:
		Ammo: 15
		ReloadCount: 5
		AmmoCondition: ammo
	DeathSounds:
	SpawnActorOnDeath:
		Actor: SCRIN.Husk
		RequiresCondition: !empdisable
	SpawnActorOnDeath@EMP:
		Actor: SCRIN.Husk.EMP
		RequiresCondition: empdisable
	Rearmable:
		RearmActors: gahpad, nahpad
		AmmoPools: primary, flares
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		Margin: 4, 5
		AmmoPools: primary
		PipCount: 3
		FullSequence: pip-ammo
		EmptySequence: pip-ammoempty
		Palette: pips
	AppearsOnRadar:
		ValidRelationships: Ally
	AppearsOnRadar@ENEMY:
		UseLocation: true
		ValidRelationships: Neutral, Enemy
		RequiresCondition: !rank-elite
	BotCapabilities:
		Capabilities: Aircraft, AntiArmor

