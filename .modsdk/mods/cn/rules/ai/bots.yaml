Player:
	ModularBot@bot-cn-ai:
		Name: bot-cn-ai.name
		Type: cn
	ModularBot@bot-cn-rush:
		Name: bot-cn-rush.name
		Type: cn-rush
	ModularBot@bot-cn-turtle:
		Name: bot-cn-turtle.name
		Type: cn-turtle
	ModularBot@bot-cn-tech:
		Name: bot-cn-tech.name
		Type: cn-tech
	ModularBot@bot-cn-expansion:
