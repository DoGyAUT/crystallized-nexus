		Type: cn-expansion
	ModularBot@bot-cn-steamroller:
		Name: bot-cn-steamroller.name
		Type: cn-steamroller
	GrantConditionOnBotOwner@cn:
		Condition: enable-cn-ai
		Bots: cn
	GrantConditionOnBotOwner@cn-rush:
		Condition: enable-cn-rush
		Bots: cn-rush
	GrantConditionOnBotOwner@cn-turtle:
		Condition: enable-cn-turtle
		Bots: cn-turtle
	GrantConditionOnBotOwner@cn-tech:
		Condition: enable-cn-tech
		Bots: cn-tech
	GrantConditionOnBotOwner@cn-expansion:
		Condition: enable-cn-expansion
		Bots: cn-expansion
	GrantConditionOnBotOwner@cn-steamroller:
		Condition: enable-cn-steamroller
		Bots: cn-steamroller
	CNBotProfileBotModule@adaptive:
		RequiresCondition: enable-cn-ai
		Profile: Adaptive
		LateTechTypes: gatech, gaplug, natmpl, namisl, napyra
		TechBudgetDifficultyScale:
			Easy: 70
			Normal: 100
			Hard: 130
			Brutal: 160
		TechTickDifficultyScale:
			Easy: 140
			Normal: 100
			Hard: 75
			Brutal: 55
		# The adaptive switching thresholds live in profiles.yaml, which mod.yaml loads AFTER this file.
		# AdaptiveExpansionIncomeThreshold and AdaptiveRushUnitThreshold used to be set here as well, at
		# 250 and 14, and were silently overwritten there with 300 and 12 - so the values anyone read here
		# were not the values the bot ran on. One place only.
		AdaptiveTurtleDangerThreshold: 420
		AdaptiveExpansionGraceTicks: 3600
		RushUnitThresholdEarlyOffset: 6
		RushUnitThresholdLateOffset: -4
		AdaptiveStartProfiles: Rush, Expansion, Turtle
