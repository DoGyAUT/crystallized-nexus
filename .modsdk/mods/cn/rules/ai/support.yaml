	DeployBotModule:
		RequiresCondition: enable-cn-ai || enable-cn-rush || enable-cn-turtle || enable-cn-tech || enable-cn-expansion || enable-cn-steamroller
		ScanInterval: 25
		Groups:
			Artillery:
				ActorTypes: nhwtz, jugg
				Mode: Artillery
				ScanRadius: 20
				DeployRange: 18
				SafeRange: 5
				DeployCooldown: 200
			TickTank:
				ActorTypes: ttnk
				Mode: Stats
				# Deploying is worth an armour bonus, so a tick tank should be dug in whenever something is
				# in reach - SafeRange is already 0, so closeness never drives it back up. Raised from 6 to
				# 8 only so the deploy animation has time to finish before contact rather than starting as
				# the enemy arrives.
				DeployRange: 8
				SafeRange: 0
				DeployCooldown: 150
			EMP:
				ActorTypes: mobilemp
				Mode: Ability
				ScanRadius: 15
				DeployRange: 8
				AbilityDuration: 100
	CNMcvExpansionManagerBotModule@cn:
		RequiresCondition: enable-cn-ai || enable-cn-rush || enable-cn-turtle || enable-cn-tech || enable-cn-expansion || enable-cn-steamroller
		McvTypes: gmcv, nmcv
		ConstructionYardTypes: gacnst, nacnst
		McvFactoryTypes: gaweap, naweap
		MinimumConstructionYardCount: 1
		AdditionalConstructionYardCount: 1
		# Ceiling only - a good free spot is what actually triggers an expansion now.
		# Total construction yards = MinimumConstructionYardCount + this.
		AdditionalConstructionYardCounts:
			Rush: 1
			Turtle: 1
			Tech: 2
			# Expansion's whole idea is to sit on the map's resources before anyone else does, so its
			# ceiling is set by how many fields a map has rather than by what a base needs.
			Expansion: 8
			Steamroller: 3
		# One MCV at a time means every expansion waits out the previous drive and deploy. Expansion
		# founds three at once; Steamroller two, since it expands to feed production rather than to
		# claim ground. The rest keep the old serial behaviour.
		MaxConcurrentMcvs: 1
		MaxConcurrentMcvCounts:
			Expansion: 3
			Steamroller: 2
		# A construction yard buys a build site and no build throughput - one building queue is shared by
		# all of them - so spreading before a region is finished just makes every site grow slower and
		# leaves the newest ones bare. One region at a time; Expansion, whose whole idea is the land grab,
		# gets two.
		MaxRegionsUnderDevelopment: 1
		MaxRegionsUnderDevelopmentCounts:
			Expansion: 2
		BuildAdditionalMCVCashAmount: 9000
		BuildAdditionalMCVCashAmounts:
			Turtle: 12000
			Expansion: 5000
			Steamroller: 7500
		# Opportunity expansion: MCV cost (2500) plus headroom, and the spot has to score net positive.
		# Rush and Turtle expand sparingly - one extra yard, and only for a clearly good spot.
		# A yard may only relocate out of a base this small. Larger bases would be left behind as dead
		# weight - without a construction yard the group stops being a build site.
		RelocateConyardMaxBaseSize: 12
		OpportunityExpansionCashAmount: 3500
		ExpansionAttractionThresholdPermille: 0
		ExpansionAttractionThresholdsPermille:
			Rush: 250
			Turtle: 250
		EnableStrategicOutposts: true
		McvEnemyBaseAvoidanceRadius: 10
		McvEnemyBaseHardAvoidanceRadius: 4
		McvEnemyBaseRoutePenalty: 2048
		McvSafeMoveWaypointPathCells: 12
		# Distance the MCV aims to keep from the *centre* of a resource field. At 8 it lands inside any
		# field wider than that, and the clearance check then has to reject every candidate the ring
		# produced. Aiming further out means the preferred ring already sits beside the field instead
		# of on it, with room left for the refinery between yard and tiberium.
		CRmodeTryMaintainRange: 14
		McvExpansionCoordinationRadius: 24
		McvExpansionCoordinationPenalty: 768
		CBmodeFrontlineOutpostBonus: 384
		CBmodeOutpostPreferredProgress: 58
		CBmodeOutpostProgressTolerance: 22
		CBmodeOutpostCorridorWidth: 12
		CBmodeOutpostEnemyMinRange: 18
		CBmodeOutpostFriendlyMinRange: 12
		ExpansionGoalMinimumHoldTicks: 3000
		ExpansionGoalMatchRadius: 6
	CaptureManagerBotModule@test:
		RequiresCondition: enable-cn-ai || enable-cn-rush || enable-cn-turtle || enable-cn-tech || enable-cn-expansion || enable-cn-steamroller
		CapturingActorTypes: engineer, nengineer
		CapturableActorTypes: cahosp, caarmr, caaray
		MinimumCaptureDelay: 125
		MaximumCaptureTargetOptions: 25
