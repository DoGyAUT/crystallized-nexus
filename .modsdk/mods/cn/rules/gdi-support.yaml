GAMG:
	Inherits: ^Support
	Inherits@IDISABLE: ^DisableOnPowerDown
	Inherits@AUTOTARGET: ^AutoTargetAll
	WithMakeAnimation:
		BodyNames: make
	WithSpriteBody:
		Name: make
		Sequence: invisible
	WithWallSpriteBody:
		RequiresCondition: !build-incomplete
		Type: wall
	Valued:
		Cost: 200
	Tooltip:
		Name: actor-gamg.name
	Buildable:
		Queue: Support
		BuildPaletteOrder: 70
		Prerequisites: gapile, ~structures.gdi, ~techlevel.low
		Description: actor-gamg.description
	CNHealth:
		HP: 500
	Armor:
		Type: Medium
	BlocksProjectiles:
		Height: 768
	BodyOrientation:
		QuantizedFacings: 32
	DetectCloaked:
		RequiresCondition: !empdisable && !disabled
	Turreted:
		TurnSpeed: 40
		InitialFacing: 896
		RealignDelay: -1
	AttackTurreted:
		RequiresCondition: !build-incomplete
		PauseOnCondition: empdisable || disabled
	WithSpriteTurret:
		RequiresCondition: !build-incomplete
		Recoils: true
		Sequence: turret-vulcan
	WithMuzzleOverlay:
	IsometricSelectable:
		Height: 48
	Armament:
		Weapon: VulcanTower
		LocalOffset: 910,-96,1570, 910,88,1570
		MuzzleSequence: muzzle_mg
		MuzzlePalette: effect
		Recoil: 64
		RecoilRecovery: 32
	Power:
		RequiresCondition: !disabled
		Amount: -30
	WithIdleOverlay@LIGHTS:
		RequiresCondition: !build-incomplete && !disabled
		Sequence: idle-lights
		Palette: player-nobright
		IsPlayerPalette: True
	WithIdleOverlay@LIGHTS-BRIGHT:
		RequiresCondition: !build-incomplete && !disabled
		Sequence: idle-lights-bright
		Palette: bright
	LineBuildNode:
		Types: turret
	ProvidesPrerequisite@buildingname:
	BotCapabilities:
		Capabilities: Defense, InfantryDefense

