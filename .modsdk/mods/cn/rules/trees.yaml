VEINHOLE:
	HiddenUnderShroud:
	RadarColorFromTerrain:
		Terrain: Veins
	AppearsOnMapPreview:
		Terrain: Veins
	Building:
		Footprint: xxx xxx xxx
		Dimensions: 3, 3
	BodyOrientation:
		QuantizedFacings: 1
	AppearsOnRadar:
	Tooltip:
		Name: actor-veinhole-name
	RenderSprites:
		Palette: player
	WithSpriteBody:
	MapEditorData:
		Categories: Resource spawn
	Interactable:
	CNHealth:
		HP: 2500
	ChangesHealth:
		Step: 50
		Delay: 10
		StartIfBelow: 100
		DamageCooldown: 500
#	TerrainLightSource:
#		Range: 6c184
#		Intensity: 0.01
#		RedTint: 1.0
#		GreenTint: 0.5
#		BlueTint: 0.01
	WithIdleAnimation:
		Interval: 50, 500
	SpawnActorOnDamage@TIBCLOUD:
		Actors: TIBCLOUD1, TIBCLOUD2
		Probability: 100
		Cooldown: 150
		SpawnCount: 2
		SpawnRadius: 2
		OwnerType: InternalName
		InternalOwner: Neutral
		Sequence: active
	SeedsResource:
		ResourceType: Veins
		Interval: 5
	AmbientSound:
		SoundFiles: veinhole01.aud, veinhole02.aud, veinhole03.aud, veinhole04.aud, veinhole05.aud, veinhole06.aud, veinhole07.aud
		Delay: 150, 450
		Interval: 300, 800
	HitShape:
		UseTargetableCellsOffsets: true

