DOGGIE:
	Inherits@1: ^Infantry
	Inherits@2: ^RegularInfantryDeath
	Inherits@3: ^HealsOnTiberium
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	MapEditorData:
		Categories: Critter
	Tooltip:
		Name: actor-doggie-name
	CNHealth:
		HP: 250
	Selectable:
		Bounds: 724, 1448
	Valued:
		Cost: 100
	Armor:
		Type: Light
	RevealsShroud:
		Range: 4c0
	Mobile:
		Speed: 113
	Voiced:
		VoiceSet: Fiend
	Targetable:
		TargetTypes: Ground, Creep
	Armament:
		Weapon: FiendShard
	AttackFrontal:
		Voice: Attack
		FacingTolerance: 0
	AttackWander:
		WanderMoveRadius: 2
		MinMoveDelay: 200
		MaxMoveDelay: 600
	-SpawnActorOnDeath@FLAMEGUY:
	WithDeathAnimation@fire:
		DeathSequence: die-
		DeathTypes:
			FireDeath: burning
	HitShape:
		Type: Circle
			Radius: 213
	GrantConditionOnTerrain:
		Condition: hidingplace
		TerrainTypes: Tiberium, BlueTiberium, RedTiberiun
	GrantConditionOnMovement:
		Condition: moving
	GrantConditionOnAttack:
		ArmamentNames: primary
		Condition: attacking
	RenderSprites:
		Palette: greentiberium
	WithSpriteBody:
		RequiresCondition: hidingplace && !moving && !attacking
		StartSequence: laydown
		Sequence: hide
	WithInfantryBody:
		RequiresCondition: !hidingplace || moving || attacking
	AmbientSound:
		SoundFiles: fiendscream01.aud, fiendscream02.aud, fiendscream03.aud, fiendscream04.aud, fiendscream05.aud, fiendscream06.aud, fiendscream07.aud
		Delay: 150, 450
		Interval: 300, 800

VISC_SML:
